  --brand: #2bb3a6; --brand-deep: #0b3d39; --brand-soft: #123a36; --red: #ff6170;

select option { color: #1d2a28; background: #fff; }
select:focus-visible, button:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 4px; }
.seg button { font: 500 .9rem var(--font-body); border: 0; background: transparent; color: var(--muted); padding: 6px 14px; border-radius: 6px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--brand); color: #fff; }
.seg button:hover:not([aria-pressed="true"]) { color: var(--fg); }
.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.status { font-size: .8rem; color: var(--muted); }
.status b { color: var(--fg); font-weight: 500; }

.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }

.chip { display: inline-flex; align-items: center; gap: 4px; font: 600 .78rem var(--font-num); padding: 2px 8px; border-radius: 99px; justify-self: start; }
.chip.up { color: var(--up); background: color-mix(in srgb, var(--up) 14%, transparent); }

.chip.na { color: var(--muted); background: color-mix(in srgb, var(--muted) 14%, transparent); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; min-width: 0; display: grid; gap: 10px; }

table { width: 100%; border-collapse: collapse; font-size: .9rem; min-width: 640px; }
th, td { padding: 10px 12px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }

function parseCSV(text) {
  const out = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (c === '"') q = false;
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); out.push(row); row = []; cell = "";
    } else cell += c;
  }
  if (cell !== "" || row.length) { row.push(cell); out.push(row); }
  return out.filter(r => r.some(v => v.trim() !== ""));
}

    const o = {};
    h.forEach((k, i) => {
      const raw = (r[i] ?? "").trim();
      if (k === "公司" || k === "年月") o[k] = raw;
      else { const n = parseFloat(raw.replace(/,/g, "")); o[k] = isNaN(n) ? null : n; }
    });
    return o;
  }).filter(o => o["年份"] && o["月份"] && o["公司"]);
}

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt = (v, eps) => v == null ? "—" : v.toLocaleString("zh-TW", { minimumFractionDigits: eps ? 2 : 1, maximumFractionDigits: eps ? 2 : 1 });
const find = (y, m, co = state.company) => state.rows.find(r => r["年份"] === y && r["月份"] === m && r["公司"] === co);

function change(cur, prev) {
  if (cur == null || prev == null) return { cls: "na", text: "無去年資料", pct: "—", diff: null };
  const diff = cur - prev;
  if (prev < 0 && cur >= 0) return { cls: "up", text: "轉盈", pct: "轉盈", diff };
  if (prev > 0 && cur < 0) return { cls: "down", text: "轉虧", pct: "轉虧", diff };
  if (prev === 0) return { cls: "na", text: "—", pct: "—", diff };
  const p = diff / Math.abs(prev) * 100;
  const s = (p >= 0 ? "▲ " : "▼ ") + Math.abs(p).toFixed(1) + "%";
  return { cls: p >= 0 ? "up" : "down", text: s, pct: s, diff };
}

function fillSelects() {
  const years = [...new Set(state.rows.map(r => r["年份"]))].sort((a, b) => a - b);
  const ys = document.getElementById("selYear");
  ys.innerHTML = years.map(y => `<option value="${y}">${y} 年</option>`).join("");
  if (!years.includes(state.year)) state.year = years[years.length - 1];
  ys.value = state.year;
  fillMonths();
}
function fillMonths() {
  const months = [...new Set(state.rows.filter(r => r["年份"] === state.year).map(r => r["月份"]))].sort((a, b) => a - b);
  const ms = document.getElementById("selMonth");
  ms.innerHTML = months.map(m => `<option value="${m}">${m} 月</option>`).join("");
  if (!months.includes(state.month)) state.month = months[months.length - 1];
  ms.value = state.month;
}
function fillCompanies() {
  const cos = [...new Set(state.rows.map(r => r["公司"]))];
  if (!cos.includes(state.company)) state.company = cos[0];
  const seg = document.getElementById("coSeg");
  seg.innerHTML = cos.map(c => `<button type="button" data-co="${c}" aria-pressed="${c === state.company}">${c}</button>`).join("");
  seg.onclick = e => { const b = e.target.closest("button"); if (!b) return; state.company = b.dataset.co; render(); };
  const ms = document.getElementById("metricSeg");
  ms.innerHTML = BAR_METRICS.map(([k, l]) => `<button type="button" data-m="${k}" aria-pressed="${k === state.metric}">${l}</button>`).join("");
  ms.onclick = e => { const b = e.target.closest("button"); if (!b) return; state.metric = b.dataset.m; render(); };
}

function renderKPIs() {
  const cur = find(state.year, state.month), prev = find(state.year - 1, state.month);
  document.getElementById("kpis").innerHTML = FIELDS.map(f => {
    const c = cur?.[f.key], p = prev?.[f.key], ch = change(c, p);
    return `<div class="kpi">
      <div class="lbl">${f.label}</div>
      <div class="val num${c < 0 ? " neg" : ""}">${fmt(c, f.eps)}</div>
      <span class="chip ${ch.cls}">${ch.text}</span>
      <div class="prev">去年同期 <span class="num">${fmt(p, f.eps)}</span></div>
    </div>`;
  }).join("");
}

function renderTable() {
  const y = state.year, m = state.month;
  document.getElementById("tblTitle").textContent = `三家公司 ${y}/${String(m).padStart(2, "0")} vs 去年同期`;
  document.getElementById("thCur").textContent = `${y}/${String(m).padStart(2, "0")}`;
  document.getElementById("thPrev").textContent = `${y - 1}/${String(m).padStart(2, "0")}`;
  const cos = [...new Set(state.rows.map(r => r["公司"]))];
  document.getElementById("tbody").innerHTML = cos.map(co => {
    const cur = find(y, m, co), prev = find(y - 1, m, co);
    return `<tr class="co"><td colspan="5">${co}</td></tr>` + TABLE_FIELDS.map(k => {
      const eps = k.includes("EPS"), c = cur?.[k], p = prev?.[k], ch = change(c, p);
      const d = ch.diff;
      return `<tr><td class="metric">${k.replace("(元)", "（元）")}</td>
        <td class="num${c < 0 ? " neg" : ""}">${fmt(c, eps)}</td>
        <td class="num${p < 0 ? " neg" : ""}">${fmt(p, eps)}</td>
        <td class="num${d < 0 ? " neg" : ""}">${d == null ? "—" : (d > 0 ? "+" : "") + fmt(d, eps)}</td>
        <td><span class="chip ${ch.cls}">${ch.pct}</span></td></tr>`;
    }).join("");
  }).join("");
}

function series(year, key) {
  return Array.from({ length: 12 }, (_, i) => find(year, i + 1)?.[key] ?? null);
}

function renderCharts() {
  const brand = css("--brand"), prevC = css("--prev"), muted = css("--muted"), line = css("--line"), fg = css("--fg");
  const font = { family: css("--font-num") || "sans-serif", size: 12 };
  const labels = Array.from({ length: 12 }, (_, i) => `${i + 1}月`);
  const y = state.year, m = state.month;
  const metricName = BAR_METRICS.find(x => x[0] === state.metric)[1];
  document.getElementById("barTitle").textContent = `${state.company} 每月${metricName === "營收" ? "營收" : metricName + "損益"}`;
  ["lgCur", "lgCur2"].forEach(id => document.getElementById(id).textContent = `${y} 年`);
  ["lgPrev", "lgPrev2"].forEach(id => document.getElementById(id).textContent = `${y - 1} 年`);

  const fade = c => c + "66";
  const curColors = labels.map((_, i) => i + 1 === m ? brand : fade(brand.length === 7 ? brand : "#00857c"));
  const prevColors = labels.map((_, i) => i + 1 === m ? prevC : fade(prevC.length === 7 ? prevC : "#a8bcb8"));

  const common = {
    responsive: true, maintainAspectRatio: false, animation: { duration: 300 },
    interaction: { mode: "index", intersect: false },
    plugins: {
      legend: { display: false },
      tooltip: { callbacks: { label: c => `${c.dataset.label}：${fmt(c.parsed.y)}` } },
    },
    scales: {
      x: { grid: { display: false }, ticks: { color: muted, font }, border: { color: line } },
      y: { grid: { color: line }, ticks: { color: muted, font, callback: v => v.toLocaleString("zh-TW") }, border: { display: false } },
    },
  };

  const barData = {
    labels,
    datasets: [
      { label: `${y - 1} 年`, data: series(y - 1, state.metric), backgroundColor: prevColors, borderRadius: 3, maxBarThickness: 18 },
      { label: `${y} 年`, data: series(y, state.metric), backgroundColor: curColors, borderRadius: 3, maxBarThickness: 18 },
    ],
  };
  if (barChart) { barChart.data = barData; barChart.options = common; barChart.update(); }
  else barChart = new Chart(document.getElementById("barChart"), { type: "bar", data: barData, options: common });

  const lineData = {
    labels,
    datasets: [
      { label: `${y - 1} 年`, data: series(y - 1, "累積稅後損益"), borderColor: prevC, backgroundColor: prevC, borderWidth: 2, pointRadius: 0, pointHoverRadius: 4, tension: .25, spanGaps: false },
      { label: `${y} 年`, data: series(y, "累積稅後損益"), borderColor: brand, backgroundColor: brand, borderWidth: 2.5, tension: .25,
        pointRadius: labels.map((_, i) => i + 1 === m ? 5 : 0), pointHoverRadius: 5, pointBackgroundColor: brand },
    ],
  };
  const lineOpts = { ...common, scales: { x: { ...common.scales.x }, y: { ...common.scales.y } } };
  if (lineChart) { lineChart.data = lineData; lineChart.options = lineOpts; lineChart.update(); }
  else lineChart = new Chart(document.getElementById("lineChart"), { type: "line", data: lineData, options: lineOpts });
}

function render() {
  document.querySelectorAll("#coSeg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.co === state.company));
  document.querySelectorAll("#metricSeg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.m === state.metric));
  renderKPIs(); renderTable(); renderCharts();
}

function boot(text, sourceLabel) {
  state.rows = toRows(text);
  fillSelects(); fillCompanies(); render();
  document.getElementById("status").innerHTML = sourceLabel;
}

document.getElementById("selYear").addEventListener("change", e => { state.year = +e.target.value; fillMonths(); render(); });
document.getElementById("selMonth").addEventListener("change", e => { state.month = +e.target.value; render(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => state.rows.length && renderCharts());
new MutationObserver(() => state.rows.length && renderCharts()).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

// ---- 業務團隊（分頁「業務名稱」）----
const TEAM_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent("業務名稱")}`;
const TEAM_SNAPSHOT = `地區,業務名稱,性別,個人介紹
北,Vicky,f,hi
中,Parren,f,ya
南,Emily,f,wow`;
const REGION_ORDER = ["北", "中", "南", "東"];
const GENDER = { f: "女", m: "男", "女": "女", "男": "男" };
const team = { people: [], region: "全部" };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const regionRank = r => { const i = REGION_ORDER.indexOf(r); return i < 0 ? 99 : i; };

function loadTeam(text) {
  const [head, ...body] = parseCSV(text);
  const h = head.map(s => s.trim());
  team.people = body.map(r => Object.fromEntries(h.map((k, i) => [k, (r[i] ?? "").trim()]))).filter(p => p["業務名稱"]);
  const regions = [...new Set(team.people.map(p => p["地區"]).filter(Boolean))].sort((a, b) => regionRank(a) - regionRank(b));
  const seg = document.getElementById("regionSeg");
  seg.innerHTML = ["全部", ...regions].map(r => `<button type="button" data-r="${esc(r)}" aria-pressed="${r === team.region}">${esc(r === "全部" ? r : r + "區")}</button>`).join("");
  seg.onclick = e => { const b = e.target.closest("button"); if (!b) return; team.region = b.dataset.r; renderTeam(); };
  renderTeam();
}
function renderTeam() {
  document.querySelectorAll("#regionSeg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.r === team.region));
  const list = team.people.filter(p => team.region === "全部" || p["地區"] === team.region)
    .sort((a, b) => regionRank(a["地區"]) - regionRank(b["地區"]));
  document.getElementById("teamTitle").textContent = `業務團隊（${list.length} 人）`;
  document.getElementById("team").innerHTML = list.length ? list.map(p => {
    const name = p["業務名稱"], g = GENDER[(p["性別"] || "").toLowerCase()] || p["性別"];
    return `<article class="person">
      <div class="avatar" aria-hidden="true">${esc(name.slice(0, 1).toUpperCase())}</div>
      <div class="name">${esc(name)}${p["地區"] ? `<span class="region">${esc(p["地區"])}區</span>` : ""}</div>
      <div class="meta">${g ? "性別：" + esc(g) : ""}</div>
      ${p["個人介紹"] ? `<p class="bio">${esc(p["個人介紹"])}</p>` : ""}
    </article>`;
  }).join("") : `<p class="empty">這個地區目前沒有業務資料。</p>`;
}
(async () => {
  try {
    const res = await fetch(`${TEAM_URL}&_=${Date.now()}`, { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const text = await res.text();
    if (!text.includes("業務名稱")) throw new Error("format");
    loadTeam(text);
  } catch { loadTeam(TEAM_SNAPSHOT); }
})();

(async () => {
  try {
    const ctrl = new AbortController(); setTimeout(() => ctrl.abort(), 6000);
    const res = await fetch(`${LIVE_URL}&_=${Date.now()}`, { signal: ctrl.signal, cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const text = await res.text();
    if (!text.includes("公司")) throw new Error("format");
    boot(text, `<b>即時資料</b>・${new Date().toLocaleString("zh-TW", { hour12: false })} 從 Google Sheets 讀取`);
  } catch {
    boot(SNAPSHOT, `<b>資料快照</b>・2026/10/02 自 Google Sheets 擷取`);
  }
})();
</script>
